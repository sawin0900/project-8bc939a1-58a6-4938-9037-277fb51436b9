<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Страница не найдена | Центр Притяжения</title>
  <meta name="robots" content="noindex,follow" />
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #0f172a;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 48px;
      line-height: 1.1;
    }
    p {
      margin: 0 0 24px;
      font-size: 18px;
      color: #475569;
    }
    a {
      display: inline-block;
      text-decoration: none;
      background: #1d4ed8;
      color: #ffffff;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 600;
    }
    a:hover {
      background: #1e40af;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>Страница не найдена или была перемещена.</p>
    <a href="/">На главную</a>
  </main>
</body>
</html>
