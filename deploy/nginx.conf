# Redirect all HTTP traffic to HTTPS, while preserving ACME challenges.
server {
    listen 80;
    listen [::]:80;
    server_name centr-prityazheniya.ru www.centr-prityazheniya.ru;

    # Allow Let's Encrypt HTTP-01 validation without redirect loops.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://centr-prityazheniya.ru$request_uri;
    }
}

# Canonical HTTPS host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name centr-prityazheniya.ru;

    root /var/www/centr-prityazheniya/dist;
    index index.html;

    # IMPORTANT: ensure these certificate files exist on the server.
    ssl_certificate /etc/letsencrypt/live/centr-prityazheniya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centr-prityazheniya.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Health check endpoint for uptime monitors and search bot diagnostics.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Static assets.
    location ~* \.(?:css|js|mjs|json|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Explicit SPA routes.
    location ~ ^/(|services|stages|documentation|projects|emergency|articles(?:/.*)?|news(?:/.*)?|faq|contacts|auth|admin(?:/.*)?)$ {
        try_files $uri /index.html;
    }

    # Custom 404 page for unknown URLs.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Everything else -> real HTTP 404.
    location / {
        try_files $uri =404;
    }
}

# Redirect HTTPS www host to canonical non-www domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.centr-prityazheniya.ru;

    ssl_certificate /etc/letsencrypt/live/centr-prityazheniya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centr-prityazheniya.ru/privkey.pem;

    return 301 https://centr-prityazheniya.ru$request_uri;
}
