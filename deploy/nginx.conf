# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name centr-prityazheniya.ru www.centr-prityazheniya.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://centr-prityazheniya.ru$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name centr-prityazheniya.ru;

    root /var/www/centr-prityazheniya;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/centr-prityazheniya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centr-prityazheniya.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Hide nginx version
    server_tokens off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https://*.supabase.co https://mc.yandex.ru https://mc.yandex.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Health check
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Static assets — strict 404 if missing, long cache
    location ~* \.(?:css|js|mjs|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # XML, txt, webmanifest — short cache
    location ~* \.(?:xml|txt|webmanifest)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Auth/admin — not prerendered, serve index.html (React handles routing)
    location ~ ^/(auth|admin)(/.*)?$ {
        try_files /index.html =500;
    }

    # Remove trailing slashes
    rewrite ^/(.+)/$ /$1 permanent;

    # 404 error page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # All other routes — use prerendered files; real 404 for unknown paths
    location / {
        try_files $uri $uri/index.html @not_found;
    }

    location @not_found {
        return 404;
    }
}

# www -> non-www redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.centr-prityazheniya.ru;

    ssl_certificate /etc/letsencrypt/live/centr-prityazheniya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centr-prityazheniya.ru/privkey.pem;

    server_tokens off;

    return 301 https://centr-prityazheniya.ru$request_uri;
}