server {
    listen 80;
    server_name centr-prityazheniya.ru www.centr-prityazheniya.ru;

    root /var/www/centr-prityazheniya/dist;
    index index.html;

    # Static assets
    location ~* \.(?:css|js|mjs|json|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Explicit SPA routes
    location ~ ^/(|services|stages|documentation|projects|emergency|articles(?:/.*)?|news(?:/.*)?|faq|contacts|auth|admin(?:/.*)?)$ {
        try_files $uri /index.html;
    }

    # Custom 404 page for unknown URLs
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Everything else -> real HTTP 404
    location / {
        try_files $uri =404;
    }
}
