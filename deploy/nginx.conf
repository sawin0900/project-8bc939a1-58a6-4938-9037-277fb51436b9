# Redirect all HTTP traffic to HTTPS, while preserving ACME challenges.
server {
    listen 80;
    listen [::]:80;
    server_name centr-prityazheniya.ru www.centr-prityazheniya.ru;

    # Allow Let's Encrypt HTTP-01 validation without redirect loops.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://centr-prityazheniya.ru$request_uri;
    }
}

# Canonical HTTPS host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name centr-prityazheniya.ru;

    root /var/www/centr-prityazheniya/dist;
    index index.html;

    # IMPORTANT: ensure these certificate files exist on the server.
    ssl_certificate /etc/letsencrypt/live/centr-prityazheniya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centr-prityazheniya.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Security headers. CSP is duplicated in HTTP headers so crawlers and scanners
    # receive it before parsing HTML.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https://*.supabase.co https://mc.yandex.ru https://mc.yandex.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Health check endpoint for uptime monitors and search bot diagnostics.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Dynamic sitemaps with current static pages and published news.
    location = /sitemap.xml {
        proxy_pass https://ivrnoeomnbspvyxhhnwc.supabase.co/functions/v1/sitemap;
        proxy_set_header Host ivrnoeomnbspvyxhhnwc.supabase.co;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        expires 15m;
        add_header Cache-Control "public, max-age=900" always;
    }

    location = /news-sitemap.xml {
        proxy_pass https://ivrnoeomnbspvyxhhnwc.supabase.co/functions/v1/sitemap?type=news;
        proxy_set_header Host ivrnoeomnbspvyxhhnwc.supabase.co;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        expires 15m;
        add_header Cache-Control "public, max-age=900" always;
    }

    # Static assets.
    location ~* \.(?:css|js|mjs|json|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Canonicalize trailing slashes for clean URLs.
    rewrite ^/(.+)/$ /$1 permanent;

    # Non-prerendered private SPA entry points that must still be reachable directly.
    location ~ ^/(auth|admin|admin/analytics)$ {
        try_files /index.html =404;
    }

    # Custom 404 page for unknown URLs.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Public routes are prerendered as /path/index.html during the build.
    # Unknown routes must stay real HTTP 404 responses instead of falling back to /index.html.
    location / {
        try_files $uri $uri/ =404;
    }
}

# Redirect HTTPS www host to canonical non-www domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.centr-prityazheniya.ru;

    ssl_certificate /etc/letsencrypt/live/centr-prityazheniya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centr-prityazheniya.ru/privkey.pem;

    return 301 https://centr-prityazheniya.ru$request_uri;
}
